plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id "com.google.gms.google-services"
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    // Provide default empty values to avoid crash when key.properties is missing
    keystoreProperties["keyAlias"] = ""
    keystoreProperties["keyPassword"] = ""
    keystoreProperties["storeFile"] = ""
    keystoreProperties["storePassword"] = ""
}

android {
    namespace = "net.ptmate.ptmate_client"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    // sourceSets {
    //     main.java.srcDirs += "src/main/kotlin"
    // }

	compileOptions {
		coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lintOptions {
        disable "InvalidPackage"
         checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId = "net.ptmate.ptmate_client"
        minSdkVersion = 24
        targetSdkVersion = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (keystoreProperties["storeFile"]) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystoreProperties["storeFile"] && !keystoreProperties["storeFile"].isEmpty()) {
                signingConfig signingConfigs.release
            }
            // Enable code shrinking if needed
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
	coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.core:core-ktx:1.12.0"
	implementation 'com.google.android.play:integrity:1.3.0'
}

configurations.all {
    resolutionStrategy {
        force "androidx.browser:browser:1.8.0"
        force "androidx.core:core-ktx:1.15.0"
        force "androidx.core:core:1.15.0"
        force "androidx.activity:activity-ktx:1.9.3"
        force "androidx.activity:activity-compose:1.9.3"
        force "androidx.activity:activity:1.9.3"
    }
}

flutter {
    source "../.."
}
